<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Schedule App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel" data-presets="react">
      const { useState, useEffect, useCallback } = React;

      const DAYS = ['จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์', 'อาทิตย์'];
      const HOURS = Array.from({ length: 24 }, (_, i) => i);

      function getWeekNumber(date) {
        const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
        const dayNum = d.getUTCDay() || 7;
        d.setUTCDate(d.getUTCDate() + 4 - dayNum);
        const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
        return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
      }

      function formatDate(date) {
        return date.toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' });
      }

      function Login({ onLogin }) {
        const [username, setUsername] = useState('');
        const [password, setPassword] = useState('');
        const [isRegister, setIsRegister] = useState(false);
        const [error, setError] = useState('');

        const handleSubmit = async (e) => {
          e.preventDefault();
          setError('');

          try {
            const res = await fetch(`/api/auth/${isRegister ? 'register' : 'login'}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ username, password })
            });

            const data = await res.json();
            if (!res.ok) {
              setError(data.error || 'Something went wrong');
              return;
            }

            onLogin(data.token);
          } catch (err) {
            setError('Network error');
          }
        };

        return (
          <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 to-indigo-100">
            <div className="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
              <h1 className="text-3xl font-bold text-center text-gray-800 mb-2">📅 Schedule App</h1>
              <p className="text-center text-gray-500 mb-8">
                {isRegister ? 'สร้างบัญชีใหม่' : 'เข้าสู่ระบบ'}
              </p>

              {error && (
                <div className="bg-red-50 text-red-600 p-3 rounded-lg mb-4 text-sm">
                  {error}
                </div>
              )}

              <form onSubmit={handleSubmit} className="space-y-4">
                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-1">ชื่อผู้ใช้</label>
                  <input
                    type="text"
                    value={username}
                    onChange={(e) => setUsername(e.target.value)}
                    className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                    required
                  />
                </div>

                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-1">รหัสผ่าน</label>
                  <input
                    type="password"
                    value={password}
                    onChange={(e) => setPassword(e.target.value)}
                    className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                    required
                  />
                </div>

                <button
                  type="submit"
                  className="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition font-medium"
                >
                  {isRegister ? 'สมัครสมาชิก' : 'เข้าสู่ระบบ'}
                </button>
              </form>

              <p className="text-center text-sm text-gray-500 mt-6">
                {isRegister ? 'มีบัญชีอยู่แล้ว?' : 'ยังไม่มีบัญชี?'}{' '}
                <button
                  onClick={() => setIsRegister(!isRegister)}
                  className="text-blue-600 hover:underline"
                >
                  {isRegister ? 'เข้าสู่ระบบ' : 'สมัครสมาชิก'}
                </button>
              </p>
            </div>
          </div>
        );
      }

      function Navbar({ onLogout, page, setPage }) {
        return (
          <nav className="bg-white shadow-sm border-b">
            <div className="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
              <div className="flex items-center gap-6">
                <span
                  className="text-xl font-bold text-blue-600 cursor-pointer"
                  onClick={() => setPage('calendar')}
                >
                  📅 Schedule App
                </span>
                <div className="flex gap-4">
                  <button
                    onClick={() => setPage('calendar')}
                    className={`text-sm font-medium ${
                      page === 'calendar' ? 'text-blue-600' : 'text-gray-500 hover:text-gray-700'
                    }`}
                  >
                    ปฏิทิน
                  </button>
                  <button
                    onClick={() => setPage('settings')}
                    className={`text-sm font-medium ${
                      page === 'settings' ? 'text-blue-600' : 'text-gray-500 hover:text-gray-700'
                    }`}
                  >
                    ตั้งค่า
                  </button>
                </div>
              </div>

              <button
                onClick={onLogout}
                className="text-sm text-gray-500 hover:text-red-600 transition"
              >
                ออกจากระบบ
              </button>
            </div>
          </nav>
        );
      }

      function WeeklyCalendar({ token }) {
        const [classes, setClasses] = useState([]);
        const [currentDate, setCurrentDate] = useState(new Date());
        const [showAddModal, setShowAddModal] = useState(false);
        const [showCancelModal, setShowCancelModal] = useState(false);
        const [selectedClass, setSelectedClass] = useState(null);
        const [conflicts, setConflicts] = useState([]);

        const weekNumber = getWeekNumber(currentDate);
        const weekStart = new Date(currentDate);
        weekStart.setDate(currentDate.getDate() - currentDate.getDay() + 1);

        const fetchClasses = useCallback(async () => {
          try {
            const res = await fetch('/api/classes', {
              headers: { Authorization: `Bearer ${token}` }
            });
            const data = await res.json();
            setClasses(data);
          } catch (err) {
            console.error('Failed to fetch classes:', err);
          }
        }, [token]);

        useEffect(() => {
          fetchClasses();
        }, [fetchClasses]);

        useEffect(() => {
          const allClasses = classes.filter(c => {
            if (c.is_temporary) return c.temporary_week === weekNumber;
            const cancelled = JSON.parse(c.cancelled_weeks || '[]');
            return !cancelled.includes(weekNumber);
          });

          const conflictList = [];
          for (let i = 0; i < allClasses.length; i++) {
            for (let j = i + 1; j < allClasses.length; j++) {
              const a = allClasses[i];
              const b = allClasses[j];
              const aDays = JSON.parse(a.days);
              const bDays = JSON.parse(b.days);
              const commonDays = aDays.filter(d => bDays.includes(d));
              if (commonDays.length > 0) {
                const aStart = parseInt(a.start_time.split(':')[0]) * 60 + parseInt(a.start_time.split(':')[1]);
                const aEnd = parseInt(a.end_time.split(':')[0]) * 60 + parseInt(a.end_time.split(':')[1]);
                const bStart = parseInt(b.start_time.split(':')[0]) * 60 + parseInt(b.start_time.split(':')[1]);
                const bEnd = parseInt(b.end_time.split(':')[0]) * 60 + parseInt(b.end_time.split(':')[1]);
                if (aStart < bEnd && bStart < aEnd) {
                  conflictList.push({ a, b, days: commonDays });
                }
              }
            }
          }
          setConflicts(conflictList);
        }, [classes, weekNumber]);

        const getClassesForDayAndHour = (dayIndex, hour) => {
          return classes.filter(c => {
            const days = JSON.parse(c.days);
            if (!days.includes(dayIndex)) return false;

            if (c.is_temporary) {
              return c.temporary_week === weekNumber;
            }

            const cancelled = JSON.parse(c.cancelled_weeks || '[]');
            if (cancelled.includes(weekNumber)) return false;

            const startHour = parseInt(c.start_time.split(':')[0]);
            const endHour = parseInt(c.end_time.split(':')[0]);
            return hour >= startHour && hour < endHour;
          });
        };

        const navigateWeek = (direction) => {
          const newDate = new Date(currentDate);
          newDate.setDate(currentDate.getDate() + direction * 7);
          setCurrentDate(newDate);
        };

        const handleCancelClass = async (classItem) => {
          try {
            const res = await fetch(`/api/classes/${classItem.id}/cancel-week`, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                Authorization: `Bearer ${token}`
              },
              body: JSON.stringify({ week: weekNumber })
            });
            if (res.ok) {
              fetchClasses();
              setShowCancelModal(false);
              setSelectedClass(null);
            }
          } catch (err) {
            console.error('Failed to cancel class:', err);
          }
        };

        const handlePrint = () => {
          window.print();
        };

        const weekEnd = new Date(weekStart);
        weekEnd.setDate(weekStart.getDate() + 6);

        return (
          <div className="max-w-7xl mx-auto p-4">
            <div className="flex items-center justify-between mb-6">
              <div>
                <h1 className="text-2xl font-bold text-gray-800">ปฏิทินรายสัปดาห์</h1>
                <p className="text-gray-500">
                  สัปดาห์ที่ {weekNumber} — {formatDate(weekStart)} ถึง {formatDate(weekEnd)}
                </p>
              </div>
              <div className="flex gap-2">
                <button
                  onClick={() => navigateWeek(-1)}
                  className="px-4 py-2 bg-white border border-gray-300 rounded-lg hover:bg-gray-50"
                >
                  ← สัปดาห์ก่อน
                </button>
                <button
                  onClick={() => setCurrentDate(new Date())}
                  className="px-4 py-2 bg-white border border-gray-300 rounded-lg hover:bg-gray-50"
                >
                  วันนี้
                </button>
                <button
                  onClick={() => navigateWeek(1)}
                  className="px-4 py-2 bg-white border border-gray-300 rounded-lg hover:bg-gray-50"
                >
                  สัปดาห์ถัดไป →
                </button>
                <button
                  onClick={() => setShowAddModal(true)}
                  className="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700"
                >
                  + เพิ่มคลาส
                </button>
                <button
                  onClick={handlePrint}
                  className="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700"
                >
                  🖨️ พิมพ์ PDF
                </button>
              </div>
            </div>

            {conflicts.length > 0 && (
              <div className="bg-yellow-50 border border-yellow-200 rounded-lg p-4 mb-4">
                <h3 className="font-medium text-yellow-800 mb-2">⚠️ ตารางซ้ำซ้อน {conflicts.length} รายการ</h3>
                <ul className="text-sm text-yellow-700 space-y-1">
                  {conflicts.map((c, i) => (
                    <li key={i}>
                      {c.a.subject} กับ {c.b.subject} — {c.days.map(d => DAYS[d]).join(', ')}
                    </li>
                  ))}
                </ul>
              </div>
            )}

            <div className="bg-white rounded-xl shadow overflow-hidden">
              <div className="grid grid-cols-8 border-b">
                <div className="p-3 bg-gray-50 font-medium text-sm text-gray-500">เวลา</div>
                {DAYS.map((day, i) => (
                  <div key={i} className="p-3 bg-gray-50 font-medium text-sm text-center">
                    {day}
                  </div>
                ))}
              </div>

              <div className="grid grid-cols-8">
                {HOURS.map(hour => (
                  <div key={hour} className="contents">
                    <div className="p-2 text-xs text-gray-400 text-right border-r border-b bg-gray-50">
                      {hour.toString().padStart(2, '0')}:00
                    </div>
                    {DAYS.map((_, dayIndex) => {
                      const dayClasses = getClassesForDayAndHour(dayIndex, hour);
                      return (
                        <div
                          key={dayIndex}
                          className="min-h-[60px] border-r border-b p-1 relative"
                        >
                          {dayClasses.map(cls => (
                            <div
                              key={cls.id}
                              className={`text-xs p-1 rounded mb-1 cursor-pointer ${
                                cls.is_temporary
                                  ? 'bg-purple-100 text-purple-800 border border-purple-200'
                                  : 'bg-blue-100 text-blue-800 border border-blue-200'
                              }`}
                              onClick={() => {
                                setSelectedClass(cls);
                                setShowCancelModal(true);
                              }}
                            >
                              <div className="font-medium truncate">{cls.subject}</div>
                              <div className="truncate">{cls.teacher}</div>
                              <div className="truncate">{cls.room}</div>
                            </div>
                          ))}
                        </div>
                      );
                    })}
                  </div>
                ))}
              </div>
            </div>

            {showAddModal && (
              <AddClassModal
                token={token}
                onClose={() => setShowAddModal(false)}
                onCreated={() => {
                  fetchClasses();
                  setShowAddModal(false);
                }}
              />
            )}

            {showCancelModal && selectedClass && (
              <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50">
                <div className="bg-white rounded-xl p-6 w-full max-w-md">
                  <h2 className="text-xl font-bold mb-4">
                    {selectedClass.is_temporary ? 'คลาสชั่วคราว' : 'คลาสปกติ'} — {selectedClass.subject}
                  </h2>
                  <p className="text-gray-600 mb-4">
                    สัปดาห์ที่ {weekNumber}
                  </p>
                  <div className="flex gap-3">
                    <button
                      onClick={() => handleCancelClass(selectedClass)}
                      className="flex-1 bg-red-600 text-white py-2 rounded-lg hover:bg-red-700"
                    >
                      ยกเลิกคลาสสัปดาห์นี้
                    </button>
                    <button
                      onClick={() => {
                        setShowCancelModal(false);
                        setSelectedClass(null);
                      }}
                      className="flex-1 bg-gray-200 text-gray-800 py-2 rounded-lg hover:bg-gray-300"
                    >
                      ปิด
                    </button>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

      function AddClassModal({ token, onClose, onCreated }) {
        const [form, setForm] = useState({
          subject: '',
          teacher: '',
          room: '',
          start_time: '09:00',
          end_time: '10:00',
          days: [],
          is_temporary: false,
          temporary_week: ''
        });

        const handleSubmit = async (e) => {
          e.preventDefault();
          try {
            const res = await fetch('/api/classes', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                Authorization: `Bearer ${token}`
              },
              body: JSON.stringify(form)
            });
            if (res.ok) {
              onCreated();
            }
          } catch (err) {
            console.error('Failed to create class:', err);
          }
        };

        const toggleDay = (dayIndex) => {
          setForm(prev => ({
            ...prev,
            days: prev.days.includes(dayIndex)
              ? prev.days.filter(d => d !== dayIndex)
              : [...prev.days, dayIndex]
          }));
        };

        return (
          <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50">
            <div className="bg-white rounded-xl p-6 w-full max-w-lg max-h-[90vh] overflow-y-auto">
              <h2 className="text-xl font-bold mb-4">เพิ่มคลาส</h2>

              <form onSubmit={handleSubmit} className="space-y-4">
                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-1">ประเภทคลาส</label>
                  <div className="flex gap-4">
                    <label className="flex items-center gap-2">
                      <input
                        type="radio"
                        checked={!form.is_temporary}
                        onChange={() => setForm(prev => ({ ...prev, is_temporary: false }))}
                      />
                      คลาสปกติ (เกิดซ้ำทุกสัปดาห์)
                    </label>
                    <label className="flex items-center gap-2">
                      <input
                        type="radio"
                        checked={form.is_temporary}
                        onChange={() => setForm(prev => ({ ...prev, is_temporary: true }))}
                      />
                      คลาสชั่วคราว (ครั้งเดียว)
                    </label>
                  </div>
                </div>

                {form.is_temporary && (
                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">สัปดาห์ที่</label>
                    <input
                      type="number"
                      value={form.temporary_week}
                      onChange={(e) => setForm(prev => ({ ...prev, temporary_week: e.target.value }))}
                      className="w-full px-3 py-2 border rounded-lg"
                      placeholder="เช่น 5"
                    />
                  </div>
                )}

                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-1">ชื่อวิชา</label>
                  <input
                    type="text"
                    value={form.subject}
                    onChange={(e) => setForm(prev => ({ ...prev, subject: e.target.value }))}
                    className="w-full px-3 py-2 border rounded-lg"
                    required
                  />
                </div>

                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-1">ชื่ออาจารย์</label>
                  <input
                    type="text"
                    value={form.teacher}
                    onChange={(e) => setForm(prev => ({ ...prev, teacher: e.target.value }))}
                    className="w-full px-3 py-2 border rounded-lg"
                    required
                  />
                </div>

                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-1">ห้องเรียน</label>
                  <input
                    type="text"
                    value={form.room}
                    onChange={(e) => setForm(prev => ({ ...prev, room: e.target.value }))}
                    className="w-full px-3 py-2 border rounded-lg"
                    required
                  />
                </div>

                <div className="grid grid-cols-2 gap-4">
                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">เวลาเริ่ม</label>
                    <input
                      type="time"
                      value={form.start_time}
                      onChange={(e) => setForm(prev => ({ ...prev, start_time: e.target.value }))}
                      className="w-full px-3 py-2 border rounded-lg"
                      required
                    />
                  </div>
                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">เวลาสิ้นสุด</label>
                    <input
                      type="time"
                      value={form.end_time}
                      onChange={(e) => setForm(prev => ({ ...prev, end_time: e.target.value }))}
                      className="w-full px-3 py-2 border rounded-lg"
                      required
                    />
                  </div>
                </div>

                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-2">วันเรียน</label>
                  <div className="flex flex-wrap gap-2">
                    {DAYS.map((day, i) => (
                      <button
                        key={i}
                        type="button"
                        onClick={() => toggleDay(i)}
                        className={`px-3 py-1 rounded-full text-sm ${
                          form.days.includes(i)
                            ? 'bg-blue-600 text-white'
                            : 'bg-gray-100 text-gray-600 hover:bg-gray-200'
                        }`}
                      >
                        {day}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="flex gap-3 pt-4">
                  <button
                    type="submit"
                    className="flex-1 bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700"
                  >
                    สร้างคลาส
                  </button>
                  <button
                    type="button"
                    onClick={onClose}
                    className="flex-1 bg-gray-200 text-gray-800 py-2 rounded-lg hover:bg-gray-300"
                  >
                    ยกเลิก
                  </button>
                </div>
              </form>
            </div>
          </div>
        );
      }

      function Settings({ token }) {
        const [classes, setClasses] = useState([]);
        const [editingClass, setEditingClass] = useState(null);
        const [showDeleteConfirm, setShowDeleteConfirm] = useState(null);

        const fetchClasses = async () => {
          try {
            const res = await fetch('/api/classes', {
              headers: { Authorization: `Bearer ${token}` }
            });
            const data = await res.json();
            setClasses(data);
          } catch (err) {
            console.error('Failed to fetch classes:', err);
          }
        };

        useEffect(() => {
          fetchClasses();
        }, [token]);

        const handleDelete = async (classId) => {
          try {
            const res = await fetch(`/api/classes/${classId}`, {
              method: 'DELETE',
              headers: { Authorization: `Bearer ${token}` }
            });
            if (res.ok) {
              fetchClasses();
              setShowDeleteConfirm(null);
            }
          } catch (err) {
            console.error('Failed to delete class:', err);
          }
        };

        const handleUpdate = async (e) => {
          e.preventDefault();
          try {
            const res = await fetch(`/api/classes/${editingClass.id}`, {
              method: 'PUT',
              headers: {
                'Content-Type': 'application/json',
                Authorization: `Bearer ${token}`
              },
              body: JSON.stringify({
                subject: editingClass.subject,
                teacher: editingClass.teacher,
                room: editingClass.room,
                start_time: editingClass.start_time,
                end_time: editingClass.end_time,
                days: editingClass.days
              })
            });
            if (res.ok) {
              fetchClasses();
              setEditingClass(null);
            }
          } catch (err) {
            console.error('Failed to update class:', err);
          }
        };

        const regularClasses = classes.filter(c => !c.is_temporary);
        const temporaryClasses = classes.filter(c => c.is_temporary);

        return (
          <div className="max-w-4xl mx-auto p-4">
            <h1 className="text-2xl font-bold text-gray-800 mb-6">ตั้งค่าคลาส</h1>

            <div className="mb-8">
              <h2 className="text-lg font-semibold text-gray-700 mb-4">คลาสปกติ (เกิดซ้ำทุกสัปดาห์)</h2>
              {regularClasses.length === 0 ? (
                <p className="text-gray-500">ยังไม่มีคลาสปกติ</p>
              ) : (
                <div className="space-y-3">
                  {regularClasses.map(cls => (
                    <div key={cls.id} className="bg-white rounded-lg border p-4 flex items-center justify-between">
                      <div>
                        <div className="font-medium text-gray-800">{cls.subject}</div>
                        <div className="text-sm text-gray-500">
                          {cls.teacher} • {cls.room} • {cls.start_time}–{cls.end_time}
                        </div>
                        <div className="text-xs text-gray-400">
                          {JSON.parse(cls.days).map(d => DAYS[d]).join(', ')}
                        </div>
                      </div>
                      <div className="flex gap-2">
                        <button
                          onClick={() => setEditingClass(cls)}
                          className="px-3 py-1 text-sm bg-blue-100 text-blue-700 rounded hover:bg-blue-200"
                        >
                          แก้ไข
                        </button>
                        <button
                          onClick={() => setShowDeleteConfirm(cls)}
                          className="px-3 py-1 text-sm bg-red-100 text-red-700 rounded hover:bg-red-200"
                        >
                          ลบ
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>

            <div>
              <h2 className="text-lg font-semibold text-gray-700 mb-4">คลาสชั่วคราว</h2>
              {temporaryClasses.length === 0 ? (
                <p className="text-gray-500">ยังไม่มีคลาสชั่วคราว</p>
              ) : (
                <div className="space-y-3">
                  {temporaryClasses.map(cls => (
                    <div key={cls.id} className="bg-white rounded-lg border p-4 flex items-center justify-between">
                      <div>
                        <div className="font-medium text-gray-800">{cls.subject}</div>
                        <div className="text-sm text-gray-500">
                          {cls.teacher} • {cls.room} • {cls.start_time}–{cls.end_time}
                        </div>
                        <div className="text-xs text-gray-400">
                          สัปดาห์ที่ {cls.temporary_week} • {JSON.parse(cls.days).map(d => DAYS[d]).join(', ')}
                        </div>
                      </div>
                      <div className="flex gap-2">
                        <button
                          onClick={() => setEditingClass(cls)}
                          className="px-3 py-1 text-sm bg-blue-100 text-blue-700 rounded hover:bg-blue-200"
                        >
                          แก้ไข
                        </button>
                        <button
                          onClick={() => setShowDeleteConfirm(cls)}
                          className="px-3 py-1 text-sm bg-red-100 text-red-700 rounded hover:bg-red-200"
                        >
                          ลบ
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>

            {editingClass && (
              <EditClassModal
                classItem={editingClass}
                onClose={() => setEditingClass(null)}
                onSave={() => {
                  fetchClasses();
                  setEditingClass(null);
                }}
              />
            )}

            {showDeleteConfirm && (
              <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50">
                <div className="bg-white rounded-xl p-6 w-full max-w-md">
                  <h2 className="text-xl font-bold mb-4">ยืนยันการลบ</h2>
                  <p className="text-gray-600 mb-6">
                    ต้องการลบคลาส "{showDeleteConfirm.subject}" ใช่ไหม? ไม่สามารถกู้คืนได้
                  </p>
                  <div className="flex gap-3">
                    <button
                      onClick={() => handleDelete(showDeleteConfirm.id)}
                      className="flex-1 bg-red-600 text-white py-2 rounded-lg hover:bg-red-700"
                    >
                      ลบ
                    </button>
                    <button
                      onClick={() => setShowDeleteConfirm(null)}
                      className="flex-1 bg-gray-200 text-gray-800 py-2 rounded-lg hover:bg-gray-300"
                    >
                      ยกเลิก
                    </button>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

      function EditClassModal({ classItem, onClose, onSave }) {
        const [form, setForm] = useState({
          subject: classItem.subject,
          teacher: classItem.teacher,
          room: classItem.room,
          start_time: classItem.start_time,
          end_time: classItem.end_time,
          days: JSON.parse(classItem.days)
        });

        const handleSubmit = async (e) => {
          e.preventDefault();
          try {
            const res = await fetch(`/api/classes/${classItem.id}`, {
              method: 'PUT',
              headers: {
                'Content-Type': 'application/json',
                Authorization: `Bearer ${localStorage.getItem('token')}`
              },
              body: JSON.stringify(form)
            });
            if (res.ok) {
              onSave();
            }
          } catch (err) {
            console.error('Failed to update class:', err);
          }
        };

        const toggleDay = (dayIndex) => {
          setForm(prev => ({
            ...prev,
            days: prev.days.includes(dayIndex)
              ? prev.days.filter(d => d !== dayIndex)
              : [...prev.days, dayIndex]
          }));
        };

        return (
          <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50">
            <div className="bg-white rounded-xl p-6 w-full max-w-lg max-h-[90vh] overflow-y-auto">
              <h2 className="text-xl font-bold mb-4">แก้ไขคลาส</h2>

              <form onSubmit={handleSubmit} className="space-y-4">
                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-1">ชื่อวิชา</label>
                  <input
                    type="text"
                    value={form.subject}
                    onChange={(e) => setForm(prev => ({ ...prev, subject: e.target.value }))}
                    className="w-full px-3 py-2 border rounded-lg"
                    required
                  />
                </div>

                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-1">ชื่ออาจารย์</label>
                  <input
                    type="text"
                    value={form.teacher}
                    onChange={(e) => setForm(prev => ({ ...prev, teacher: e.target.value }))}
                    className="w-full px-3 py-2 border rounded-lg"
                    required
                  />
                </div>

                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-1">ห้องเรียน</label>
                  <input
                    type="text"
                    value={form.room}
                    onChange={(e) => setForm(prev => ({ ...prev, room: e.target.value }))}
                    className="w-full px-3 py-2 border rounded-lg"
                    required
                  />
                </div>

                <div className="grid grid-cols-2 gap-4">
                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">เวลาเริ่ม</label>
                    <input
                      type="time"
                      value={form.start_time}
                      onChange={(e) => setForm(prev => ({ ...prev, start_time: e.target.value }))}
                      className="w-full px-3 py-2 border rounded-lg"
                      required
                    />
                  </div>
                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">เวลาสิ้นสุด</label>
                    <input
                      type="time"
                      value={form.end_time}
                      onChange={(e) => setForm(prev => ({ ...prev, end_time: e.target.value }))}
                      className="w-full px-3 py-2 border rounded-lg"
                      required
                    />
                  </div>
                </div>

                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-2">วันเรียน</label>
                  <div className="flex flex-wrap gap-2">
                    {DAYS.map((day, i) => (
                      <button
                        key={i}
                        type="button"
                        onClick={() => toggleDay(i)}
                        className={`px-3 py-1 rounded-full text-sm ${
                          form.days.includes(i)
                            ? 'bg-blue-600 text-white'
                            : 'bg-gray-100 text-gray-600 hover:bg-gray-200'
                        }`}
                      >
                        {day}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="flex gap-3 pt-4">
                  <button
                    type="submit"
                    className="flex-1 bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700"
                  >
                    บันทึก
                  </button>
                  <button
                    type="button"
                    onClick={onClose}
                    className="flex-1 bg-gray-200 text-gray-800 py-2 rounded-lg hover:bg-gray-300"
                  >
                    ยกเลิก
                  </button>
                </div>
              </form>
            </div>
          </div>
        );
      }

      function App() {
        const [token, setToken] = useState(localStorage.getItem('token'));
        const [page, setPage] = useState('calendar');

        useEffect(() => {
          if (token) {
            localStorage.setItem('token', token);
          } else {
            localStorage.removeItem('token');
          }
        }, [token]);

        if (!token) {
          return <Login onLogin={setToken} />;
        }

        return (
          <div className="min-h-screen bg-gray-50">
            <Navbar
              onLogout={() => setToken(null)}
              page={page}
              setPage={setPage}
            />
            {page === 'calendar' && <WeeklyCalendar token={token} />}
            {page === 'settings' && <Settings token={token} />}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
